<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TILATA SMART QR PAYMENT PRO</title>
    <style>
        /* =========================================
           ДИЗАЙН БӨЛҮГҮ (CSS)
           ========================================= */
        :root {
            --bg-color: #0b1120;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --blue-accent: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 15px;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
        }

        /* Башы (Header) */
        .header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 1.25rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Карточкалар (Sections) */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            font-size: 1.05rem;
            color: var(--blue-accent);
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Банк баскычтары (Grid) */
        .bank-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .bank-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .bank-btn:active {
            transform: scale(0.96);
            background-color: #1f2937;
            border-color: var(--blue-accent);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        /* Форма элементтери */
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            margin-top: 15px;
        }

        .custom-select {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 1em;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }

        .file-btn {
            border: 1px dashed var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: block;
        }

        /* QR сүрөтүн көрсөтүүчү жер */
        .qr-preview-container {
            margin-top: 15px;
            width: 100%;
            min-height: 220px;
            background-color: #ffffff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .qr-image {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: contain;
            display: none;
        }

        .placeholder {
            color: #9ca3af;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .placeholder svg {
            width: 40px;
            height: 40px;
            stroke: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Башы -->
        <header class="header">
            <h1><span>📡</span> TILATA SMART QR PAYMENT PRO</h1>
            <p>КЫРГЫЗСТАН · QR ТӨЛӨМ · ҮН БИЛДИРҮҮ</p>
        </header>

        <!-- 1-Бөлүк: Төлөм кабыл алуу -->
        <section class="card">
            <h2>1. ТӨЛӨМ КАБЫЛ АЛУУ</h2>
            <div class="bank-grid">
                <button class="bank-btn" onclick="selectBank('MBANK')">
                    <span class="dot" style="background: #8bc34a;"></span> MBANK
                </button>
                <button class="bank-btn" onclick="selectBank('OPTIMA BANK')">
                    <span class="dot" style="background: #f44336;"></span> OPTIMA BANK
                </button>
                <button class="bank-btn" onclick="selectBank('BAKAI BANK')">
                    <span class="dot" style="background: #2196f3;"></span> BAKAI BANK
                </button>
                <button class="bank-btn" onclick="selectBank('ЭЛДИК БАНК')">
                    <span class="dot" style="background: #8bc34a;"></span> ЭЛДИК БАНК
                </button>
                <button class="bank-btn" onclick="selectBank('DEMIRBANK')">
                    <span class="dot" style="background: #03a9f4;"></span> DEMIRBANK
                </button>
                <button class="bank-btn" onclick="selectBank('O!BANK')">
                    <span class="dot" style="background: #f44336;"></span> O!BANK
                </button>
            </div>
        </section>

        <!-- 2-Бөлүк: QR код жүктөө -->
        <section class="card">
            <h2>2. QR КОД ЖҮКТӨӨ</h2>
            
            <label>Банкты танда</label>
            <select id="bankSelect" class="custom-select">
                <option value="MBANK">MBANK</option>
                <option value="OPTIMA BANK">OPTIMA BANK</option>
                <option value="BAKAI BANK">BAKAI BANK</option>
                <option value="ЭЛДИК БАНК">ЭЛДИК БАНК</option>
                <option value="DEMIRBANK">DEMIRBANK</option>
                <option value="O!BANK">O!BANK</option>
            </select>

            <label>QR сүрөтүн танда</label>
            <div class="file-input-wrapper">
                <div class="file-btn" id="fileLabel">📁 Сүрөт тандаңыз (Файл тандоо)</div>
                <input type="file" id="qrUpload" accept="image/*">
            </div>

            <!-- QR көрсөтүүчү жер -->
            <div class="qr-preview-container" id="previewContainer">
                <div id="placeholderText" class="placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    QR код сүрөтү тандалган жок
                </div>
                <img id="qrImage" class="qr-image" alt="QR Code">
            </div>
        </section>
    </div>

    <!-- =========================================
         ЛОГИКА БӨЛҮГҮ (JAVASCRIPT)
         ========================================= -->
    <script>
        // 1. Банк тандоо (Жогорку баскычтарды басканда төмөнкү тизмеден автоматтык түрдө тандалат)
        function selectBank(bankName) {
            const selectElement = document.getElementById('bankSelect');
            selectElement.value = bankName;
            
            // Басканда кичинекей вибрация (телефондордо иштейт)
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // 2. QR сүрөтүн жүктөө жана экранга чыгаруу
        const fileInput = document.getElementById('qrUpload');
        const fileLabel = document.getElementById('fileLabel');
        const imgElement = document.getElementById('qrImage');
        const placeholder = document.getElementById('placeholderText');

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0]; // Тандалган файлды алуу

            if (file) {
                // Файлдын атын көрсөтүү
                fileLabel.textContent = "✅ " + file.name;
                fileLabel.style.color = "#8bc34a"; // Жашыл түс
                fileLabel.style.borderColor = "#8bc34a";

                // Сүрөттү окуу
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    imgElement.src = e.target.result; // Сүрөттүн дарегин берүү
                    imgElement.style.display = 'block'; // Сүрөттү көрсөтүү
                    placeholder.style.display = 'none'; // "Тандалган жок" деген жазууну жашыруу
                };
                
                reader.readAsDataURL(file); // Файлды окуп баштоо
            } else {
                // Эгер файл тандоодон баш тартса (Cancel басса)
                fileLabel.textContent = "📁 Сүрөт тандаңыз (Файл тандоо)";
                fileLabel.style.color = "var(--text-muted)";
                fileLabel.style.borderColor = "var(--border-color)";
                imgElement.style.display = 'none';
                placeholder.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
